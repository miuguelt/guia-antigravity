formulas:
  stock_seguridad: "(Venta_Diaria_Maxima - Venta_Diaria_Promedio) * Tiempo_Entrega_Dias"
  punto_reorden_rop: "(Venta_Diaria_Promedio * Tiempo_Entrega_Dias) + Stock_Seguridad"
definiciones:
  Venta_Diaria_Promedio: "promedio de salidasDiarias del historial"
  Venta_Diaria_Maxima: "máximo de salidasDiarias del historial"
regla_alerta_roja: "Stock_Actual <= Punto_Reorden_ROP"
